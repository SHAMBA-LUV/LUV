# Self-contained Foundry project for the ZK guide (separate from the repo-root token build).
# Zero dependencies: no forge-std, no cheatcodes, no file I/O — proofs are compiled-in fixtures.
# Regenerate verifiers + fixtures: cd .. && npm install && npm run build.   Test: forge test -vv
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
