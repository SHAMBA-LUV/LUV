# Self-contained Foundry project for the ZK guide (separate from the repo-root token build).
# Generate src/Groth16Verifier.sol and proof/calldata.hex first: ../circom/prove.sh
# Then:  forge install foundry-rs/forge-std --no-git && forge test -vv
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./proof" }]
