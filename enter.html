<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENTER — the door — SHAMBA LUV</title>
<meta name="description" content="The door into the verse, rendered from sane geometry: the octagon world, a door of two triangles, the pentagram lintel — enter, and the hierarchy receives you.">
<link rel="canonical" href="https://luv.pythai.net/enter.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>:root{--ink:#160a0f;--wine:#2b111c;--seam:#4a1f30;--rose:#ff4d6d;--pink:#ff006e;--purple:#8338ec;
--blush:#ffb3c1;--cream:#f6e7eb;--dim:#b98da0;--gold:#e3b25f;
--mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
--sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--blush)}a:hover{color:var(--rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--seam)}
.bar{display:flex;align-items:center;gap:14px;padding:16px 0;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:var(--cream);text-decoration:none}
.brand b{color:var(--rose)}
.bar .spacer{flex:1}
.bar a.back{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--dim)}
.bar a.back:hover{color:var(--rose)}
h1{margin:44px 0 6px;text-align:center;font-size:clamp(30px,5.5vw,48px);font-weight:800;
background:linear-gradient(100deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--dim);margin-bottom:34px}
.rankchip{display:block;width:fit-content;margin:0 auto 10px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
text-transform:uppercase;color:var(--gold);border:1px solid rgba(227,178,95,.5);border-radius:999px;padding:5px 16px}
.gfx{display:flex;justify-content:center;margin:8px 0 26px}
.gfx canvas{width:280px;height:280px}
.panel{border:1px solid var(--seam);border-radius:14px;background:var(--wine);padding:24px 26px;margin-bottom:14px}
.panel .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);margin-bottom:10px}
.panel p{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.panel p:last-child{margin-bottom:0}
.panel p b{color:var(--cream)}.panel p .g{color:var(--gold)}
.panel code{font-family:var(--mono);font-size:12.5px;color:var(--blush);word-break:break-all}
.ladder{display:flex;flex-direction:column;gap:8px;margin:0 0 26px}
.ladder a{display:flex;align-items:baseline;gap:14px;border:1px solid var(--seam);border-radius:12px;background:var(--wine);
padding:14px 20px;text-decoration:none;transition:border-color .15s}
.ladder a:hover{border-color:var(--rose)}
.ladder .rk{font-family:var(--mono);font-size:11px;color:var(--gold);flex:none;width:3.2em}
.ladder .nm{font-family:var(--mono);font-weight:700;letter-spacing:.1em;color:var(--cream);flex:none;width:8.5em;text-transform:uppercase}
.ladder .ds{font-size:13px;color:var(--dim)}
.ctarow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:28px 0 8px}
.btn{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--blush);text-decoration:none;
border:1px solid var(--seam);border-radius:999px;padding:8px 18px;transition:color .15s,border-color .15s}
.btn:hover{color:var(--rose);border-color:var(--rose)}
footer{margin-top:56px;border-top:1px solid var(--seam);padding:26px 0 44px}
footer .wrap{max-width:1180px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
footer a{text-decoration:none}
footer .spacer{flex:1}
html,body{height:100%}
#door{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#doorfade{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none}
.enterui{position:fixed;left:0;right:0;bottom:9vh;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.enterui .t{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
#enterbtn{pointer-events:auto;font-family:var(--mono);font-size:16px;font-weight:800;letter-spacing:.16em;color:#fff;
background:linear-gradient(100deg,var(--pink),var(--purple));border:0;border-radius:999px;padding:16px 44px;cursor:pointer;
box-shadow:0 12px 34px -10px rgba(255,0,110,.55)}
#enterbtn:hover{filter:brightness(1.12)}
.brandfix{position:fixed;top:16px;left:20px;z-index:2}
.skipfix{position:fixed;top:16px;right:20px;z-index:2;font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<a class="brand brandfix" href="/">&#10084; SHAMBA <b>LUV</b></a>
<a class="skipfix" href="verse.html">skip the door &#8594;</a>
<canvas id="door" aria-label="the door into the verse — sane geometry: octagon world, a door of two triangles, pentagram lintel"></canvas>
<div class="enterui">
  <span class="t">the door is real &#183; the world is an octagon &#183; the panel is two triangles</span>
  <button id="enterbtn" type="button">ENTER &#10084;</button>
  <span class="t">click, or press Enter &#8212; the controller walks you through</span>
</div>
<div id="doorfade"></div>
<noscript><div style="position:fixed;inset:0;background:#160a0f;display:flex;align-items:center;justify-content:center">
<a href="verse.html" style="font-family:monospace">the door needs JavaScript &#8212; walk around it &#8594; the verse</a></div></noscript>
<script src="substrate/sane.js?v=1"></script>
<script src="substrate/luv-enter.js?v=1"></script>
<script src="substrate/heart.js?v=2"></script>
</body>
</html>
