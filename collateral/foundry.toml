# collateral — MakerDAO-style CDP for collateralised gold (bXAU). Self-contained: no libs.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false

[fmt]
line_length = 120

[fuzz]
runs = 500
seed = "0xc011a7e2a1"
